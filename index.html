<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Diseñando la Música · Rock</title>
<style>
:root{--bg:#050505;--ink:#f2eee6;--muted:#8d8f98;--red:#d3202a;--row:#1a1a1d;--silver:#c4cad6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100%;overflow-x:hidden}
main{max-width:440px;margin:0 auto;padding:20px 22px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
header b{color:var(--ink)}
.stage{position:relative;width:min(100%,340px);aspect-ratio:1;margin:34px auto 22px}
.vinylbox{position:absolute;inset:0;transform:translateY(-7%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.open .vinylbox{transform:none}
.disc{position:absolute;inset:0;border-radius:50%;
background:conic-gradient(rgba(255,70,70,0) 0 8%,rgba(255,90,90,.3) 12%,rgba(255,70,70,0) 18% 58%,rgba(220,230,255,.2) 62%,rgba(255,255,255,0) 68%),
repeating-radial-gradient(circle,#050505 0 2px,#1a1a1c 2px 3px);box-shadow:0 0 0 1px #222,0 16px 40px rgba(211,32,42,.28)}
.label{position:absolute;inset:31%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #000}
.label img{width:100%;height:100%;object-fit:cover;display:block}
.label::before{content:"";position:absolute;top:5%;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;z-index:2}
.label::after{content:"";position:absolute;top:50%;left:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px #000;z-index:2}
.sleeve{position:absolute;inset:0;border:0;padding:0;cursor:pointer;background:#000;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.7);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s .3s}
.sleeve img{width:100%;height:100%;object-fit:cover;display:block}
.sleeve:focus-visible{outline:3px solid var(--red);outline-offset:4px}
.open .sleeve{transform:translateY(112%) rotate(-3deg);opacity:0;pointer-events:none}
.hint{text-align:center;color:var(--muted);margin:0 0 10px;min-height:1.4em;transition:opacity .4s}
.open .hint{opacity:0}
.player{opacity:0;transform:translateY(14px);transition:opacity .6s .5s,transform .6s .5s;pointer-events:none}
.open .player{opacity:1;transform:none;pointer-events:auto}
.now{text-align:center;font-weight:700;font-size:1.1rem;margin:0 0 2px}
.now small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.bar{display:flex;align-items:center;gap:10px;margin:14px 0 2px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.bar input{flex:1;accent-color:var(--red);height:24px}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;margin:4px 0 20px}
.ctl button{border:0;background:none;color:var(--ink);font-size:1.5rem;cursor:pointer;width:48px;height:48px;border-radius:50%}
.ctl button.play{background:var(--red);color:#fff;width:64px;height:64px}
.ctl button:focus-visible,.bar input:focus-visible{outline:3px solid var(--silver);outline-offset:3px}
ol{list-style:none;margin:0;padding:0}
.side{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);padding:16px 4px 6px;font-weight:700}
li button{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;background:none;border:0;border-top:1px solid var(--row);color:var(--ink);font:inherit;font-size:1rem;padding:14px 4px;cursor:pointer}
li button:focus-visible{outline:3px solid var(--silver);outline-offset:-3px}
li button span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
li.on button,li.on button span:last-child{color:var(--red);font-weight:700}
</style>
</head>
<body>
<main id="app">
  <header><b>Diseñando la Música</b><span>Rock</span></header>
  <section class="stage">
    <div class="vinylbox"><div class="disc" id="disc"><div class="label"><img src="label.jpg" alt=""></div></div></div>
    <button class="sleeve" id="sleeve" aria-label="Abrir la funda y sacar el vinilo"><img src="cover.jpg" alt="Portada de The End, So Far: una máscara de espejos que se rompe en pedazos"></button>
  </section>
  <p class="hint">Toca la funda para sacar el disco</p>
  <section class="player">
    <p class="now"><small>Sonando</small><span id="title"></span></p>
    <div class="bar"><span id="tcur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posición de la canción"><span id="ttot"></span></div>
    <div class="ctl">
      <button id="prev" aria-label="Canción anterior">⏮</button>
      <button id="play" class="play" aria-label="Reproducir">▶</button>
      <button id="next" aria-label="Canción siguiente">⏭</button>
    </div>
    <ol id="list"></ol>
  </section>
</main>
<script>
/* Cambia el orden o los nombres aquí para que coincidan con tu contraportada. */
var tracks=[
 {t:"Adderall",d:"5:41",src:"audio/01.mp3"},
 {t:"The Dying Song (Time To Sing)",d:"4:31",src:"audio/02.mp3"},
 {t:"The Chapeltown Rag",d:"4:55",src:"audio/03.mp3"},
 {t:"Yen",d:"6:48",src:"audio/04.mp3"},
 {t:"Hive Mind",d:"5:16",src:"audio/05.mp3"},
 {t:"Warranty",d:"3:51",src:"audio/06.mp3"},
 {t:"Medicine For The Dead",d:"6:17",src:"audio/07.mp3"},
 {t:"Acidic",d:"4:50",src:"audio/08.mp3"},
 {t:"Heirloom",d:"3:31",src:"audio/09.mp3"},
 {t:"H377",d:"4:23",src:"audio/10.mp3"},
 {t:"De Sade",d:"5:40",src:"audio/11.mp3"},
 {t:"Finale",d:"5:07",src:"audio/12.mp3"}
];
var $=function(id){return document.getElementById(id)};
var app=$('app'),disc=$('disc'),playBtn=$('play'),list=$('list'),seek=$('seek'),tcur=$('tcur'),ttot=$('ttot'),title=$('title');
var audio=new Audio();audio.preload='none';
var cur=0,playing=false;

function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
tracks.forEach(function(tr,i){
 if(i===0||i===6){var h=document.createElement('li');h.className='side';h.textContent=i?'Lado B':'Lado A';list.appendChild(h)}
 var li=document.createElement('li');
 li.innerHTML='<button><span>'+(i+1)+'. '+tr.t+'</span><span>'+tr.d+'</span></button>';
 li.firstChild.onclick=function(){select(i);play()};
 tr.el=li;list.appendChild(li);
});
function mark(){tracks.forEach(function(tr,i){tr.el.className=i===cur?'on':''})}
function ui(){playBtn.textContent=playing?'❚❚':'▶';playBtn.setAttribute('aria-label',playing?'Pausar':'Reproducir')}
function select(i){
 cur=(i+tracks.length)%tracks.length;
 audio.src=tracks[cur].src;
 seek.value=0;tcur.textContent='0:00';ttot.textContent=tracks[cur].d;title.textContent=tracks[cur].t;mark();
}
function play(){playing=true;ui();var p=audio.play();if(p&&p.catch)p.catch(function(){playing=false;ui()})}
function pause(){audio.pause();playing=false;ui()}
function next(){var was=playing;select(cur+1);if(was)play()}
function prev(){var was=playing;if(audio.currentTime>4){audio.currentTime=0;return}select(cur-1);if(was)play()}
playBtn.onclick=function(){playing?pause():play()};
$('next').onclick=next;$('prev').onclick=prev;
$('sleeve').onclick=function(){app.classList.add('open')};
audio.addEventListener('timeupdate',function(){
 if(isFinite(audio.duration)&&audio.duration>0){seek.value=audio.currentTime/audio.duration*1000;ttot.textContent=fmt(audio.duration)}
 tcur.textContent=fmt(audio.currentTime);
});
audio.addEventListener('ended',function(){if(cur===tracks.length-1){select(0);pause()}else next()});
audio.addEventListener('error',function(){playing=false;ui()});
seek.addEventListener('input',function(){if(isFinite(audio.duration))audio.currentTime=seek.value/1000*audio.duration});

/* Giro del disco: acelera y frena poco a poco (33⅓ rpm = 200°/s) */
var angle=0,speed=0,last=performance.now();
function frame(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;
 speed+=((playing?200:0)-speed)*Math.min(1,dt*1.8);
 if(speed<.05&&!playing)speed=0;
 angle=(angle+speed*dt)%360;
 disc.style.transform='rotate('+angle+'deg)';
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
select(0);ui();
</script>
</body>
</html>
